version: 2

sources:
  - name: raw
    database: "{{ env_var('SNOWFLAKE_DATABASE', 'ANALYTICS_DB') }}"
    schema: RAW
    description: >
      One-to-one landing copies of the source_postgres `app.*` insurance tables,
      loaded by the Airflow `postgres_to_snowflake` DAG (full snapshot each run).
    tables:
      - name: customers
      - name: agents
      - name: products
      - name: policies
      - name: premium_payments
      - name: claims
      - name: claim_payments
