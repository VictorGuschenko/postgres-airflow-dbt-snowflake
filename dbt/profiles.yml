# Connection config is read from environment variables so no secrets live in the
# repo. The dbt container receives these from the project .env file (see
# docker-compose.yaml `dbt` service and the Airflow DockerOperator call).
#
# Environments: DBT_TARGET (dev | prod) selects the output below and, via
# macros/generate_database_name.sql, the physical database
# <SNOWFLAKE_DATABASE>_DEV / _PROD. dev and prod share the account, warehouse
# and role; they differ only by database.
modern_data_stack:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'ANALYTICS_DB') }}_DEV"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE') }}"
      schema: "{{ env_var('SNOWFLAKE_SCHEMA', 'ANALYTICS') }}"
      threads: "{{ env_var('SNOWFLAKE_THREADS', '4') | int }}"
      client_session_keep_alive: false
    prod:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'ANALYTICS_DB') }}_PROD"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE') }}"
      schema: "{{ env_var('SNOWFLAKE_SCHEMA', 'ANALYTICS') }}"
      threads: "{{ env_var('SNOWFLAKE_THREADS', '4') | int }}"
      client_session_keep_alive: false
