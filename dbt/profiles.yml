# Connection config is read from environment variables so no secrets live in the
# repo. The dbt container receives these from the project .env file (see
# docker-compose.yaml `dbt` service and the Airflow DockerOperator call).
modern_data_stack:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE') }}"
      schema: "{{ env_var('SNOWFLAKE_SCHEMA', 'ANALYTICS') }}"
      threads: "{{ env_var('SNOWFLAKE_THREADS', '4') | int }}"
      client_session_keep_alive: false
